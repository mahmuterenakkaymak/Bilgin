[project]
name = "bilgin"
version = "0.1.0"
description = "NL -> T-SQL Phase 0 proof: synthetic ERP-style DB, safe executor, agent loop, eval"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSING.md"]
authors = [{ name = "Mahmut Eren Akkaymak" }]
dependencies = [
    "sqlglot==30.24.0",
    "openai==3.37.0",
    "pyodbc==5.3.0",
    "openpyxl==3.1.5",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.package-data]
"bilgin.i18n" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
